<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu · 2try1t Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="site.css" />
  <!-- Phase 4: opt into the scroll-reveal start state before first paint (no
       flash), then back out on load if reveal.js never confirmed it ran. -->
  <script>
    document.documentElement.classList.add('js-reveal');
    addEventListener('load', function () {
      if (!window.__revealReady) document.documentElement.classList.remove('js-reveal');
    });
  </script>
</head>
<body class="page page--menu">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" href="/">2try1t</a>

      <button
        class="navbar__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="navbar-menu"
        aria-label="Open navigation menu"
      >
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>

      <nav class="navbar__menu" id="navbar-menu" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/menu" aria-current="page">Menu</a>
        <a href="/order">Order</a>
        <a href="/about">About</a>
        <a class="navbar__call" href="tel:+15795039423">
          <svg class="navbar__call-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>(579) 503-9423</span>
        </a>
        <a class="btn btn--solid navbar__cta" href="/order">Start an Order</a>
      </nav>
    </div>
  </header>

  <main class="page__main" id="main">
    <header class="page-header">
      <p class="page-header__eyebrow">The Menu</p>
      <h1 class="page-header__title">Everything we make</h1>
      <p class="page-header__lede">
        Coffee, tea, cold drinks, pastries, and sandwiches, all made fresh
        through the day. Sizes and allergens are listed with each item.
      </p>
    </header>

    <div class="menu-list" id="menu-content">
      <p class="menu-loading">Loading menu…</p>
    </div>
  </main>

  <footer class="page-footer">
    <p>2try1t &middot; Winnipeg, MB &middot; © 2026</p>
  </footer>

  <script src="nav.js"></script>
  <script src="reveal.js"></script>
  <script src="menu.js"></script>
</body>
</html>
