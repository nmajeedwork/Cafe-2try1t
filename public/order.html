<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order · 2try1t CafeBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="order-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" href="/">2try1t</a>

      <button
        class="navbar__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="navbar-menu"
        aria-label="Open navigation menu"
      >
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>

      <nav class="navbar__menu" id="navbar-menu" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/order" aria-current="page">Order</a>
        <a href="/about">About</a>
        <a class="navbar__call" href="tel:+15795039423">
          <svg class="navbar__call-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span>(579) 503-9423</span>
        </a>
        <a class="btn btn--solid navbar__cta" href="/order">Start an Order</a>
      </nav>
    </div>
  </header>

  <!-- <main id="main"> wraps the widget so the shared skip-link has a target,
       matching menu.html / about.html. Nothing inside .app is touched. -->
  <main id="main">
  <div class="app">
    <header class="app-header">
      <div>
        <h1>☕ 2try1t</h1>
        <p>Ask CafeBot about our menu, ingredients, or allergens</p>
      </div>
      <button id="new-order-btn" class="new-order-btn" type="button">New Order</button>
    </header>

    <div class="layout">
      <aside class="cart-panel" id="cart-panel">
        <h2>Your Order</h2>
        <div id="cart-items" class="cart-items">
          <p class="cart-empty">Your cart is empty</p>
        </div>
        <div id="cart-totals" class="cart-totals"></div>
      </aside>

      <div class="chat-panel">
        <div id="messages" class="messages"></div>

        <form id="chat-form" class="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="Ask about the menu..."
            autocomplete="off"
            required
          />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
  </main>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
