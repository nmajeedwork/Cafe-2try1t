<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order · 2try1t CafeBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="order-page">
  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__brand" href="/">2try1t</a>

      <button
        class="navbar__toggle"
        type="button"
        aria-expanded="false"
        aria-controls="navbar-menu"
        aria-label="Open navigation menu"
      >
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>

      <nav class="navbar__menu" id="navbar-menu" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/order" aria-current="page">Order</a>
        <a href="/about">About</a>
        <a class="btn btn--solid navbar__cta" href="/order">Start an Order</a>
      </nav>
    </div>
  </header>

  <div class="app">
    <header class="app-header">
      <div>
        <h1>☕ 2try1t</h1>
        <p>Ask CafeBot about our menu, ingredients, or allergens</p>
      </div>
      <button id="new-order-btn" class="new-order-btn" type="button">New Order</button>
    </header>

    <div class="layout">
      <aside class="cart-panel" id="cart-panel">
        <h2>Your Order</h2>
        <div id="cart-items" class="cart-items">
          <p class="cart-empty">Your cart is empty</p>
        </div>
        <div id="cart-totals" class="cart-totals"></div>
      </aside>

      <div class="chat-panel">
        <div id="messages" class="messages"></div>

        <form id="chat-form" class="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="Ask about the menu..."
            autocomplete="off"
            required
          />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
